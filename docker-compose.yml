services:
  pageguard:
    build: .
    container_name: pageguard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pageguard-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - NODE_ENV=production

volumes:
  pageguard-data:
