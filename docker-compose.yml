services:
  pageguard:
    build: .
    container_name: pageguard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pageguard-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - NODE_ENV=production
    mem_limit: 1g
    cpus: "2.0"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://localhost:3000/healthz', r => process.exit(r.statusCode === 200 ? 0: 1)).on('error', () => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pageguard-data:
